<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cảm ơn bạn! - Vũ Gia Phát</title>
  <link rel="icon" href="images/logo.webp" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':

</head>
<body data-page="thank-you">
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <a class="skip-link" href="#main">Bỏ qua, đến nội dung chính</a>
  <script src="js/header.js"></script>
  
  <main id="main">
    <section class="py-5 thank-you-hero text-center" style="min-height: 60vh; display: flex; align-items: center;">
      <div class="container">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
        <h1 class="mt-4 fw-bold">Cảm ơn bạn!</h1>
        <p class="lead text-body-secondary mt-3" id="thankYouMessage">Yêu cầu của bạn đã được ghi nhận. Chúng tôi sẽ liên hệ qua Zalo/SĐT trong vòng 30 phút tới.</p>
        
        <div class="mt-5">
          <a href="index.html" class="btn btn-primary rounded-pill px-4 py-2 me-2 mb-2">Quay lại trang chủ</a>
          <a href="products.html" class="btn btn-outline-primary rounded-pill px-4 py-2 mb-2">Xem thêm sản phẩm</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Trigger GA4 and FB Pixel events
    if (typeof trackEvent === 'function') {
        trackEvent('generate_lead', { source: 'thank-you' });
    } else {
        if (typeof gtag === 'function') {
            gtag('event', 'generate_lead');
        }
        if (typeof fbq === 'function') {
            fbq('track', 'Lead');
        }
    }
  </script>
