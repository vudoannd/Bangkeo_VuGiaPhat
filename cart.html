<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Giỏ hàng và chốt đơn - Băng Keo Vũ Gia Phát.">
  <title>Giỏ hàng - Vũ Gia Phát</title>
  <link rel="icon" href="images/logo.webp" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="cart">
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

  <a class="skip-link" href="#main">Bỏ qua, đến nội dung chính</a>

  <script src="js/header.js"></script>

  <main id="main">

    <!-- =========================== TIÊU ĐỀ ========================== -->
    <section class="bg-brand-gradient py-4">
      <div class="container">
        <nav aria-label="Đường dẫn">
          <ol class="breadcrumb small mb-2">
            <li class="breadcrumb-item"><a class="link-light" href="index.html">Trang chủ</a></li>
            <li class="breadcrumb-item active text-white-50" aria-current="page">Giỏ hàng</li>
          </ol>
        </nav>
        <h1 class="mb-0 text-white">Giỏ hàng của bạn</h1>
      </div>
    </section>

    <!-- ========================== CART & CHECKOUT ========================= -->
    <section class="py-5 bg-light">
      <div class="container">
        <div class="row g-4">
          <!-- Cột trái: Danh sách sản phẩm -->
          <div class="col-lg-7 col-xl-8">
            <div class="card border-0 shadow-sm rounded-4">
              <div class="card-body p-4">
                <h5 class="card-title fw-bold mb-4">Sản phẩm trong giỏ</h5>
                
                <div id="cartItemsContainer">
                  <div class="text-center text-muted py-5">
                    <div class="spinner-border text-primary" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                  </div>
                </div>

                <div class="d-flex justify-content-between mt-4 border-top pt-4">
                  <a href="products.html" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left me-2"></i>Tiếp tục mua sắm
                  </a>
                </div>
              </div>
            </div>
          </div>

          <!-- Cột phải: Form chốt đơn & Tổng tiền -->
          <div class="col-lg-5 col-xl-4">
            <div class="card border-0 shadow-sm rounded-4 sticky-lg-top" style="top: 100px; z-index: 10;">
              <div class="card-body p-4">
                <h5 class="card-title fw-bold mb-4">Thông tin đặt hàng</h5>
                <form id="checkoutForm">
                  <div class="mb-3">
                    <label for="cName" class="form-label small fw-bold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control bg-body-tertiary" id="cName" required placeholder="Nhập họ tên...">
                  </div>
                  <div class="mb-3">
                    <label for="cPhone" class="form-label small fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control bg-body-tertiary" id="cPhone" required placeholder="Nhập SĐT Zalo để nhận báo giá...">
                  </div>
                  <div class="mb-3">
                    <label for="cAddress" class="form-label small fw-bold">Địa chỉ giao hàng</label>
                    <textarea class="form-control bg-body-tertiary" id="cAddress" rows="2" placeholder="Nhập địa chỉ (không bắt buộc)..."></textarea>
                  </div>
                  <div class="mb-4">
                    <label for="cNote" class="form-label small fw-bold">Ghi chú thêm</label>
                    <textarea class="form-control bg-body-tertiary" id="cNote" rows="2" placeholder="Ghi chú về đơn hàng, quy cách đóng gói..."></textarea>
                  </div>

                  <hr>

                  <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tạm tính</span>
                    <span class="fw-bold" id="cartSubtotal">0 đ</span>
                  </div>
                  <div class="d-flex justify-content-between mb-4 fs-5">
                    <span class="fw-bold">Tổng cộng</span>
                    <span class="fw-bold text-danger" id="cartTotal">0 đ</span>
                  </div>
                  
                  <div id="quoteNotice" class="alert alert-warning py-2 small d-none" role="alert">
                    <i class="bi bi-info-circle me-1"></i> Có sản phẩm chưa có giá, chúng tôi sẽ báo giá thêm qua Zalo.
                  </div>

                  <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold text-uppercase fs-6 shadow-sm d-flex justify-content-center align-items-center gap-2" id="btnSubmitOrder" style="background-color: var(--brand); border-color: var(--brand);">
                    <i class="bi bi-send-fill"></i> Đặt hàng qua Zalo
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ============================ FOOTER ============================ -->
  <script src="js/footer.js"></script>

  <button type="button" class="btn btn-primary to-top" aria-label="Lên đầu trang">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Supabase JS Client & Cấu hình -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/seo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
