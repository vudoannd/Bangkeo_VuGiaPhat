  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Tổng hợp các sản phẩm băng keo giá sỉ, băng keo trong, băng keo đục đóng thùng, màng PE quấn hàng giá rẻ tại xưởng sản xuất Vũ Gia Phát.">
  <title>Sản Xuất Băng Keo Đóng Thùng & Màng PE Quấn Hàng - Vũ Gia Phát</title>
  <link rel="icon" href="images/logo.webp" type="image/png">

  <!-- Bootstrap 5 + Bootstrap Icons qua CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="products">
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

  <a class="skip-link" href="#main">Bỏ qua, đến nội dung chính</a>

  <script src="js/header.js"></script>

  <main id="main">

    <!-- =========================== TIÊU ĐỀ ========================== -->
    <section class="bg-brand-gradient py-4 py-md-5">
      <div class="container">
        <nav aria-label="Đường dẫn">
          <ol class="breadcrumb small mb-3">
            <li class="breadcrumb-item"><a class="link-light" href="index.html">Trang chủ</a></li>
            <li class="breadcrumb-item active text-white-50" aria-current="page">Sản phẩm</li>
          </ol>
        </nav>
        <h1 class="mb-2">Sản phẩm băng keo</h1>
        <p class="mb-0 opacity-75" style="max-width:560px">
          Toàn bộ mẫu băng keo đang có tại kho, phân theo chất kết dính.
          Dùng bộ lọc bên dưới để tìm nhanh loại bạn cần.
        </p>
      </div>
    </section>

    <!-- ========================== DANH SÁCH ========================= -->
    <section class="py-5">
      <div class="container">

        <!-- Thanh công cụ: lọc danh mục / tìm kiếm / sắp xếp -->
        <!-- Dùng lưới row/col của Bootstrap thay vì tiện ích w-*:
             Bootstrap không có biến thể theo breakpoint cho w-* (chỉ w-25/50/75/100/auto),
             nên w-100 sẽ luôn thắng và đẩy ô tìm kiếm xuống dòng riêng trên desktop. -->
        <div class="card border shadow-sm p-3 mb-4 toolbar">
          <div class="row g-3 align-items-center">

            <!-- Các chip do main.js sinh theo danh mục thực tế trong dữ liệu -->
            <div class="col-12 col-xl-auto">
              <div class="d-flex flex-wrap gap-2" id="catChips" role="group" aria-label="Lọc theo danh mục"></div>
            </div>

            <div class="col-12 col-md col-xl-auto ms-xl-auto" style="min-width:240px">
              <div class="input-group">
                <span class="input-group-text bg-body-tertiary border-end-0 rounded-start-pill">
                  <i class="bi bi-search text-body-tertiary"></i>
                </span>
                <label class="visually-hidden" for="searchInput">Tìm kiếm sản phẩm</label>
                <input type="search" class="form-control bg-body-tertiary border-start-0 rounded-end-pill"
                  id="searchInput" placeholder="Tìm băng keo, tem nhãn…" autocomplete="off">
              </div>
            </div>

            <div class="col-12 col-md-auto">
              <label class="visually-hidden" for="sortSelect">Sắp xếp</label>
              <select class="form-select rounded-pill bg-body-tertiary" id="sortSelect" style="min-width:190px">
                <option value="newest">Mới nhất</option>
                <option value="price-asc">Giá: thấp đến cao</option>
                <option value="price-desc">Giá: cao đến thấp</option>
                <option value="rating">Đánh giá cao nhất</option>
              </select>
            </div>

          </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2
                    mb-3 small text-body-secondary">
          <span id="resultCount"></span>
          <span><i class="bi bi-info-circle me-1"></i>Giá đã bao gồm VAT · Liên hệ để có giá sỉ</span>
        </div>

        <!-- main.js đổ sản phẩm vào đây -->
        <div class="row g-3 g-md-4" id="productGrid"></div>

        <div class="text-center mt-5" id="loadMoreWrap" hidden>
          <button type="button" class="btn btn-outline-primary rounded-pill px-4" id="loadMoreBtn">
            <i class="bi bi-plus-circle me-1"></i>Xem thêm sản phẩm
          </button>
        </div>

      </div>
    </section>

  </main>

  <!-- ============================ FOOTER ============================ -->
  <script src="js/footer.js"></script>

  <!-- Modal xem nhanh sản phẩm — nội dung do main.js đổ vào -->
  <div class="modal fade" id="quickViewModal" tabindex="-1" aria-labelledby="quickViewLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fs-6" id="quickViewLabel">Chi tiết sản phẩm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body" id="quickViewBody"></div>
      </div>
    </div>
  </div>

  <button type="button" class="btn btn-primary to-top" aria-label="Lên đầu trang">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Supabase JS Client & Cấu hình -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/seo.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
